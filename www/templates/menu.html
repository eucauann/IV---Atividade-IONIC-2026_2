<ion-side-menus enable-menu-with-back-views="false">

  <ion-side-menu-content>
    <ion-nav-bar class="bar-ucsal">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left">
    <ion-header-bar class="bar-ucsal">
      <h1 class="title">Olá, {{ aluno.nome.split(' ')[0] }}</h1>
    </ion-header-bar>
    <ion-content>
      <ion-list>
        <ion-item menu-close href="#/app/noticias">
          <i class="icon ion-ios-paper"></i> Notícias e Eventos
        </ion-item>
        <ion-item menu-close href="#/app/perfil">
          <i class="icon ion-person"></i> Meus Dados
        </ion-item>
        <ion-item menu-close href="#/app/financeiro">
          <i class="icon ion-cash"></i> Financeiro
        </ion-item>
        <ion-item menu-close ng-click="sair()">
          <i class="icon ion-log-out"></i> Sair
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-side-menu>

</ion-side-menus>
